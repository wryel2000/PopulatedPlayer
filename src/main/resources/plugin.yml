name: PopulatedPlayer
version: ${version}
main: com.populatedplayer.PopulatedPlayerPlugin
api-version: '1.20'
author: PopulatedPlayer
folia-supported: false
description: Simula jogadores online apenas no TAB e na contagem do servidor.
depend:
  - ProtocolLib
commands:
  manha:
    description: Define baixa quantidade de fake players online.
    usage: /manha
    permission: populatedplayer.control
  tarde:
    description: Define média quantidade de fake players online.
    usage: /tarde
    permission: populatedplayer.control
  noite:
    description: Define alta quantidade de fake players online.
    usage: /noite
    permission: populatedplayer.control
  zero:
    description: Remove todos os fake players do TAB e pausa o chat automatico.
    usage: /zero
    permission: populatedplayer.control
  reload:
    description: Recarrega o config.yml do PopulatedPlayer em tempo real.
    usage: /reload
    permission: populatedplayer.control
  girar:
    description: Rotaciona todos os fake players atuais por novos nomes aleatorios.
    usage: /girar
    permission: populatedplayer.control
  mutarchat:
    description: Liga ou desliga as mensagens automaticas dos fake players no chat.
    usage: /mutarchat
    aliases: [mutar, mutechat, chatmute]
    permission: populatedplayer.control
permissions:
  populatedplayer.control:
    description: Permite controlar os fake players por período.
    default: op
